name: Test & Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
  # Manual re-run. A push only becomes a workflow run if GitHub delivers the
  # webhook, and on 2026-08-06 an Actions outage throttled delivery to ~15% —
  # a commit landed on dev and simply never got a run, with no way to ask for
  # one. This is that way. It deliberately does NOT promote (see that job).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan below covers every commit,
          # not just the tip.
          fetch-depth: 0

      # A committed secret should stop the pipeline before anything deploys.
      # This is the only secret scanning we have — GitHub's own push
      # protection needs Advanced Security on a private repo. Free for
      # personal accounts (orgs would need GITLEAKS_LICENSE). The full
      # history was scanned clean when this was added (2026-08-31); a false
      # positive later gets an allowlist entry in .gitleaks.toml, not a
      # removal of this step.
      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Security-rules suite. The firestore emulator needs a JDK; ubuntu-latest
      # ships one, but pin our own so a runner-image change can't break this.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run test:rules

      - run: npm run build

  # The prod bundle, built while deploy-dev and Lighthouse are still running
  # instead of after promote — it used to be ~40s of install + build at the
  # very end of the critical path. Runs only when this run can reach prod: a
  # direct push to main, or a dev push without the skip-promote marker (same
  # test as the promote job). Building early is harmless if a later gate
  # fails: deploy-production still waits on promote, and an unused artifact
  # just expires.
  build-production:
    if: >-
      github.event_name == 'push'
      && (
        github.ref == 'refs/heads/main'
        || (
          github.ref == 'refs/heads/dev'
          && !startsWith(github.event.head_commit.message, '[skip promote]')
        )
      )
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Unset until the prod OAuth client exists — the Sheets backup
          # feature hides itself when this is empty
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          # Public Web Push key. Unset = push hides itself, same safety
          # property. Per project — the dev key will NOT work here.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Crash reporting. One Sentry project for both sites — the
          # environment tag (prod/dev) splits them. Unset = feature off.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # KLIPY GIF search (comments). One public content key serves both
          # sites — not project-bound. Unset = the GIF button hides itself.
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
          # Present = upload hidden sourcemaps so stacks are readable; the
          # maps are deleted from dist before the hosting deploy.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      # Sourcemaps are already uploaded to Sentry and deleted by the build, so
      # this is exactly what gets served.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-production
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Runs either from a direct push to main, or automatically after a dev push
  # has deployed, passed Lighthouse, and fast-forwarded main. The `always()` is
  # what lets one job serve both: on a main push the dev-side jobs are skipped
  # rather than successful, and a plain `needs` would skip this too.
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test, build-production, promote]
    if: >-
      always()
      && needs.test.result == 'success'
      && needs.build-production.result == 'success'
      && (
        (github.ref == 'refs/heads/main' && github.event_name == 'push')
        || needs.promote.result == 'success'
      )
    steps:
      # For firebase.json / .firebaserc (hosting targets) and the lockfile
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist-production
          path: dist/

      # No npm ci: the only thing needed is the Firebase CLI, and the npm
      # cache restored here already holds the lockfile's copy of it.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Prod rules and Cloud Functions are NOT deployed here. The prod service
      # account can't read serviceusage (403 on serviceusage.services.get),
      # which the Firebase CLI calls before either deploy — the dev service
      # account can, which is why those ship from CI and these don't. Run
      # `make deploy-rules-prod` when firestore.rules or the indexes change,
      # and `make deploy-functions-prod` when functions/ changes.
      #
      # To automate both, grant the prod service account on fairshare-4c9a2:
      #   roles/serviceusage.serviceUsageConsumer   (rules and functions)
      #   roles/cloudfunctions.admin, roles/run.admin, roles/eventarc.admin,
      #   roles/artifactregistry.admin, roles/iam.serviceAccountUser
      #                                             (functions only)
      #
      # Hosting deploys with the repo's own firebase-tools version (the one the
      # rules/functions deploys use), not FirebaseExtended/action-hosting-deploy,
      # which downloaded firebase-tools@latest on every run — slower, and a
      # new CLI release could change a deploy with no commit behind it.
      - name: Deploy hosting to prod
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          FIREBASE_TOOLS=$(node -p "require('./package-lock.json').packages['node_modules/firebase-tools'].version")
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes --prefer-offline "firebase-tools@$FIREBASE_TOOLS" \
            deploy --only hosting:app --project fairshare-4c9a2 --non-interactive

  deploy-dev:
    if: >-
      github.ref == 'refs/heads/dev'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_DEV }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_DEV }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_DEV }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_DEV }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_DEV }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID_DEV }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY_DEV }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_ALLOWED_EMAILS: ${{ secrets.VITE_ALLOWED_EMAILS }}
          VITE_BUILD_ENV: dev

      # Rules and indexes rehearse on the isolated dev project before
      # they're ever deployed to prod (prod rules go out via `make promote`)
      - name: Deploy Firestore rules + indexes to dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" make deploy-rules-dev

      # Push notifications. Deliberately BEFORE the hosting deploy: a client
      # that advertises push should never go live ahead of the functions that
      # send it. Unlike prod (below), the dev service account can do this.
      - name: Deploy Cloud Functions to dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" make deploy-functions-dev

      # The firebase-tools npm ci already installed (see deploy-production).
      - name: Deploy hosting to dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx firebase deploy --only hosting:dev --project fairshare-split-dev --non-interactive

  # Audits the real deployed artifact on real hosting, rather than a local
  # preview — so it sees the actual bundle, headers and network the site ships
  # with. It can only reach the signed-out landing page (the app itself is
  # behind Google sign-in), so treat this as a guard on the shell: bundle
  # weight, accessibility of the entry point, and metadata.
  # One run, not three (lighthouserc.json): accessibility is the only failing
  # assertion and it's deterministic; the median of three only steadied
  # warn-only performance scores, for ~30s a run.
  lighthouse:
    if: >-
      github.ref == 'refs/heads/dev'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v5

      - name: Audit the dev site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://dev-fairshare-split.web.app
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Fast-forward main to dev, which is what makes prod and dev report the same
  # sha. Pushing with GITHUB_TOKEN deliberately does not start a second
  # workflow run, so deploy-production picks this up within this same run.
  # The opt-out has to be at the very start of the message, not merely
  # somewhere in it: `contains` also matches the body, so a commit that
  # *mentions* the marker — like the one that introduced it — opts itself out.
  #
  # Deliberately `push` only, NOT workflow_dispatch. A manual run has no
  # `github.event.head_commit`, so `startsWith(null, '[skip promote]')` is
  # false and the `!` would flip it to TRUE — silently promoting the very
  # commits that asked not to be. A manual run therefore deploys dev and
  # stops; use `make promote` when you actually mean it.
  promote:
    if: >-
      github.ref == 'refs/heads/dev'
      && github.event_name == 'push'
      && !startsWith(github.event.head_commit.message, '[skip promote]')
    runs-on: ubuntu-latest
    needs: [deploy-dev, lighthouse]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward main to dev
        run: |
          set -euo pipefail
          # Anything on main that isn't on dev means this isn't a fast-forward,
          # and force-pushing prod's history is never the automatic answer
          if ! git merge-base --is-ancestor origin/main origin/dev; then
            echo "::error::main has commits that aren't on dev, so it can't fast-forward."
            echo "Run 'make reconcile-main CONFIRM=1' once, then re-run this."
            exit 1
          fi
          git push origin "${{ github.sha }}:refs/heads/main"
